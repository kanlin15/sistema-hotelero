<div class="login-page">
  <h1>Sistema Gestion</h1>
  <p class="subtitulo">Ingresa tus credenciales para continuar</p>

  <form class="card" (ngSubmit)="ingresar()">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text"
           placeholder="Ingresa tu usuario" [(ngModel)]="usuario" />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password"
           placeholder="********" [(ngModel)]="password" />

    @if (error) {
      <div class="error">Credenciales incorrectas</div>
    }

    <button type="submit">Ingresar</button>
  </form>
</div>
