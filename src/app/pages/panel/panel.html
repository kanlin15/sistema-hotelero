<section class="panel">
  <div class="bienvenida">
    <h2>Bienvenido, {{ usuario }}</h2>
    <p>{{ fecha }}</p>
  </div>

  <div class="tarjetas">
    @for (t of tarjetas; track t.titulo) {
      <div class="tarjeta">
        <div class="texto">
          <span>{{ t.titulo }}</span>
          <strong>{{ t.valor }}</strong>
        </div>
        <span class="icono {{ t.clase }}">{{ t.icono }}</span>
      </div>
    }
  </div>

  <div class="acciones">
    <h3>Acciones Rapidas</h3>
    <div class="botones">
      <a routerLink="/habitaciones" class="btn azul">Gestion de Habitaciones</a>
      <a routerLink="/reservas" class="btn morado">Ver reservas</a>
      <a routerLink="/check" class="btn verde">check-in/check-out</a>
    </div>
  </div>
</section>
