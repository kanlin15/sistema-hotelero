<div class="registro-page">
  <form class="registro-card" (ngSubmit)="registrar()">
    <h1>Crear cuenta</h1>
    <p>Regístrate para ingresar como cliente.</p>

    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" type="text" [(ngModel)]="nombre"
           placeholder="Tu nombre" />

    <label for="usuario">Nombre de usuario</label>
    <input id="usuario" name="usuario" type="text" [(ngModel)]="usuario"
           placeholder="Ej: juancliente" />

    <label for="correo">Correo electrónico</label>
    <input id="correo" name="correo" type="email" [(ngModel)]="correo"
           placeholder="correo@ejemplo.com" />

    <label for="celular">Número de celular</label>
    <input id="celular" name="celular" type="text" [(ngModel)]="celular"
           placeholder="Ej: 3001234567" />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password"
           placeholder="Mínimo 6 caracteres" />

    <label for="confirmarPassword">Confirmar contraseña</label>
    <input id="confirmarPassword" name="confirmarPassword" type="password"
           [(ngModel)]="confirmarPassword" placeholder="Repite la contraseña" />

    @if (error) {
      <div class="error">{{ error }}</div>
    }

    @if (mensaje) {
      <div class="mensaje">{{ mensaje }}</div>
    }

    <button type="submit" [disabled]="registrando">
      {{ registrando ? 'Creando cuenta...' : 'Crear cuenta' }}
    </button>

    <button type="button" class="volver" (click)="volverAlLogin()">
      Volver al inicio de sesión
    </button>
  </form>
</div>
